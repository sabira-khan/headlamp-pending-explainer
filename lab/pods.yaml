apiVersion: v1
kind: Pod
metadata: { name: too-much-cpu }
spec: { containers: [ { name: c, image: registry.k8s.io/pause:3.10, resources: { requests: { cpu: "64" } } } ] }
---
apiVersion: v1
kind: Pod
metadata: { name: too-much-memory }
spec: { containers: [ { name: c, image: registry.k8s.io/pause:3.10, resources: { requests: { memory: 200Gi } } } ] }
---
apiVersion: v1
kind: Pod
metadata: { name: no-matching-node }
spec: { nodeSelector: { disktype: ssd }, containers: [ { name: c, image: registry.k8s.io/pause:3.10 } ] }
---
apiVersion: v1
kind: Pod
metadata: { name: gpu-node-only }
spec: { nodeSelector: { kubernetes.io/hostname: pending-lab-worker2 }, containers: [ { name: c, image: registry.k8s.io/pause:3.10 } ] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data }
spec: { storageClassName: does-not-exist, accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Pod
metadata: { name: waits-for-volume }
spec:
  containers: [ { name: c, image: registry.k8s.io/pause:3.10, volumeMounts: [ { name: d, mountPath: /d } ] } ]
  volumes: [ { name: d, persistentVolumeClaim: { claimName: data } } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: spread-out }
spec:
  replicas: 3
  selector: { matchLabels: { app: spread-out } }
  template:
    metadata: { labels: { app: spread-out } }
    spec:
      affinity: { podAntiAffinity: { requiredDuringSchedulingIgnoredDuringExecution: [ { labelSelector: { matchLabels: { app: spread-out } }, topologyKey: kubernetes.io/hostname } ] } }
      containers: [ { name: c, image: registry.k8s.io/pause:3.10 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: host-port }
spec:
  replicas: 2
  selector: { matchLabels: { app: host-port } }
  template:
    metadata: { labels: { app: host-port } }
    spec:
      nodeSelector: { kubernetes.io/hostname: pending-lab-worker }
      containers: [ { name: c, image: registry.k8s.io/pause:3.10, ports: [ { containerPort: 80, hostPort: 8080 } ] } ]
---
apiVersion: v1
kind: Pod
metadata: { name: mixed-reasons }
spec:
  tolerations: [ { key: dedicated, operator: Equal, value: gpu, effect: NoSchedule } ]
  containers: [ { name: c, image: registry.k8s.io/pause:3.10, resources: { requests: { cpu: "6", memory: 1Gi } } } ]
